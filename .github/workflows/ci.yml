name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages/protocol

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - run: bun install --frozen-lockfile
      # tauri::generate_context! embeds the built frontend.
      - run: bun run --cwd apps/desktop build
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  driver:
    name: Windows driver (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build CelmicVAD
        shell: pwsh
        run: ./drivers/windows/scripts/build.ps1 -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: CelmicVAD-${{ matrix.platform }}-testsigned
          path: drivers/windows/build/${{ matrix.platform }}/Release/CelmicVAD/
