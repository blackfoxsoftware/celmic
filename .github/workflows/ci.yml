name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages/protocol

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - run: bun install --frozen-lockfile
      # tauri::generate_context! embeds the built frontend.
      - run: bun run --cwd apps/desktop build
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  # Compiles the native module (Kotlin/Swift) inside a real app build.
  # android/ and ios/ are generated by `expo prebuild` (they're not in git).
  mobile-android:
    name: Mobile (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - name: Generate native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      # Development build: the JS comes from Metro (`bun run --cwd apps/mobile start`).
      - uses: actions/upload-artifact@v4
        with:
          name: celmic-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  mobile-ios:
    name: Mobile (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: bun install --frozen-lockfile
      - name: Generate native project (+ pod install)
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios
      - name: Build for simulator
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Celmic.xcworkspace -scheme Celmic -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build | tail -n 200

  driver:
    name: Windows driver (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build CelmicVAD
        shell: pwsh
        run: ./drivers/windows/scripts/build.ps1 -Platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: CelmicVAD-${{ matrix.platform }}-testsigned
          path: drivers/windows/build/${{ matrix.platform }}/Release/CelmicVAD/
